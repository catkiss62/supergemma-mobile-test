name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK payload
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/'
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SuperGemma-Mobile-Test-v0.1.2.apk.sha256
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SuperGemma-Mobile-Test-v0.1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SuperGemma-Mobile-Test-v0.1.2
          path: |
            app/build/outputs/apk/debug/SuperGemma-Mobile-Test-v0.1.2.apk
            app/build/outputs/apk/debug/SuperGemma-Mobile-Test-v0.1.2.apk.sha256
          retention-days: 14
      - name: Publish prerelease asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: SuperGemma Mobile Test ${{ github.run_number }}
          prerelease: true
          draft: true
          files: |
            app/build/outputs/apk/debug/SuperGemma-Mobile-Test-v0.1.2.apk
            app/build/outputs/apk/debug/SuperGemma-Mobile-Test-v0.1.2.apk.sha256
